name: Deploy is-it-ai-slop

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: isitaislop-production
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  deploy:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'

    steps:
      - name: Deploy to Raspberry Pi
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          port: ${{ secrets.PI_PORT }}
          script: |
            set -e

            FRONTEND_CHANGED="${{ needs.changes.outputs.frontend }}"
            BACKEND_CHANGED="${{ needs.changes.outputs.backend }}"

            REPO_DIR="/home/xalonious/projects/is-it-ai-slop"
            FRONTEND_DIR="$REPO_DIR/frontend"
            BACKEND_DIR="$REPO_DIR/backend"

            echo "frontend changed: $FRONTEND_CHANGED"
            echo "backend changed: $BACKEND_CHANGED"

            cd "$REPO_DIR"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            if [ "$FRONTEND_CHANGED" = "true" ]; then
              cd "$FRONTEND_DIR"

              npm ci
              npm run build
            fi

            if [ "$BACKEND_CHANGED" = "true" ]; then
              cd "$BACKEND_DIR"
              pm2 stop isitaislop || true

              npm ci
              rm -rf dist
              npm run build

              pm2 start isitaislop 
              pm2 save
            fi

      - name: Notify Discord — success
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: success
          title: "✅ Deployment #${{ github.run_number }} successful"
          description: "is it ai slop deployed to production."
          url: "https://slop.sillyapi.lol"

      - name: Notify Discord — failure
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: failure
          title: "❌ Deployment #${{ github.run_number }} failed"
          description: "Check the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."